name: Deploy Backend (Render)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-trigger:
    name: Build & Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -f -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        shell: bash

      - name: Notify deploy hook missing
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "::warning::RENDER_DEPLOY_HOOK_URL chưa được cấu hình. Bỏ qua bước kích hoạt deploy."
