services:
  - type: web
    name: lht-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node --expose-gc --max-old-space-size=384 dist/index.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEWS_DB
        value: lht-news
      - key: KNOWLEDGE_DB
        value: lht-kb
      - key: CHAT_DB
        value: lht-chat
      - key: MEMORY_DB
        value: lht-memory
      # Các biến sau nhập thủ công trên Dashboard Render (sync: false):
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Phải là v1beta — systemInstruction (developer instruction) không hỗ trợ v1
      - key: GEMINI_API_VERSION
        sync: false
      # [ANTI-QUOTA] Nhiều key cách nhau dấu phẩy: KEY2,KEY3
      - key: GEMINI_API_KEYS
        sync: false
      # [ANTI-QUOTA] Model free dự phòng khi hết quota (mặc định: gemini-2.5-flash-lite,...)
      - key: GEMINI_FREE_MODELS
        sync: false
      - key: NEWS_RSS_URL
        sync: false
      - key: FINANCE_DB_URI
        sync: false
      - key: MQTT_URL
        sync: false
      - key: PIPELINE_SECRET
        sync: false
      # Số request AI tối đa mỗi phút (thấp hơn limit free tier để tránh 429)
      - key: GEMINI_RPM
        sync: false
